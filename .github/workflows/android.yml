name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug y release
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest

      - name: Verificar que la APK no pide INTERNET
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            "$AAPT2" dump permissions "$apk" | tee /tmp/perms.txt
            if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' /tmp/perms.txt; then
              echo "::error file=app/src/main/AndroidManifest.xml::$apk pide permisos de red"
              exit 1
            fi
          done

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: musica-apk-${{ github.sha }}
          path: app/build/outputs/apk/*/*.apk
          retention-days: 30
