name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verificar que el modo niña no usa la red
        run: bash scripts/verificar-modo-nina-sin-red.sh

      - name: Compilar APK debug y release y correr pruebas
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: musica-apk-${{ github.sha }}
          path: app/build/outputs/apk/*/*.apk
          retention-days: 30
